name: 抽選データ自動更新

on:
  # 毎日 日本時間21:00頃(UTC 12:00)に実行(抽選当日の1回目)
  # mk-mode.com側の更新がまだの場合に備えて、翌朝7:00頃(UTC 22:00)にも再実行する
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 22 * * *'
  # 手動実行ボタン(Actionsタブから「Run workflow」でいつでも実行可能)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install requests

      - name: 最新データを取得して更新
        id: update
        run: python scripts/update_data.py

      - name: 変更があればコミット&プッシュ
        run: |
          git config user.name "kujilab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: 抽選データ自動更新 ($(date -u +'%Y-%m-%d'))"
            git push
          fi
